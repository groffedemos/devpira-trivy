name: sast

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

env:
  URL_GITLEAKS_RELEASE: 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz'
  DIR_DOCKERFILE: './src/ConsoleAppJobHttpRequest'
  DIR_DEVOPS_ARTIFACTS: './devops'
  DIR_TESTS: './tests'
  DIR_PROJECT_FILE: './src/ConsoleAppJobHttpRequest'
  PROJECT_FILE: 'ConsoleAppJobHttpRequest.csproj'
  
jobs:
  secrets-scanning:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar o Gitleaks
        run: |
          mkdir tmp-gitleaks
          cd tmp-gitleaks
          echo ''
          echo "Url utilizada para download do Gitleaks: ${{ env.URL_GITLEAKS_RELEASE }}"
          echo ''
          curl -L -o gitleaks.tar.gz ${{ env.URL_GITLEAKS_RELEASE }}
          tar -xvzf gitleaks.tar.gz
          ls
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/
          cd ..
          rm -rf tmp-gitleaks

      - name: Testar o Gitleaks
        run: |
          gitleaks --version
          echo ''
          gitleaks --help

      - name: Criar diretorio results
        run: mkdir results

      - name: Executar o Gitleaks no repositorio
        run: |
          curl -L -o ./results/report-basic.tmpl https://raw.githubusercontent.com/gitleaks/gitleaks/refs/heads/master/report_templates/basic.tmpl
          gitleaks dir . \
            --report-format=sarif \
            --report-path=./results/results-secrets.sarif

      - name: Exibir conteudo do diretorio results
        if: always()
        run: |
          cd results
          pwd
          ls -l

      - name: Upload arquivo SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ./results/results-secrets.sarif
          category: sast-tools

  dependency-scanning:
    runs-on: ubuntu-latest
    needs: secrets-scanning
    if: always()
    
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Exibir o conteúdo do arquivo .csproj antes dos ajustes com sed
        run: |
          cd ${{ env.DIR_DOCKERFILE }}
          cat ${{ env.PROJECT_FILE }}

      - name: Configurar o arquivo .csproj
        run: |
          cd ${{ env.DIR_DOCKERFILE }}
          if ! grep -q '<RestorePackagesWithLockFile>true</RestorePackagesWithLockFile>' "${{ env.PROJECT_FILE }}"; then
              sed -i '/<PropertyGroup>/a \    <RestorePackagesWithLockFile>true</RestorePackagesWithLockFile>' "${{ env.PROJECT_FILE }}"
          fi
        
      - name: Exibir o conteúdo do arquivo .csproj após ajustes com sed
        run: |
          cd ${{ env.DIR_DOCKERFILE }}
          cat ${{ env.PROJECT_FILE }}

      - name: Restaurar dependências
        run: |
          cd ${{ env.DIR_DOCKERFILE }}
          dotnet restore

      - name: Instalar o Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Testar execução do Trivy
        run: |
          trivy --version
          echo ''
          trivy

      - name: Criar o diretório results
        run: mkdir -p results

      - name: Executar o Trivy gerando SARIF
        run: |
          trivy fs --scanners vuln \
            --exit-code 1 \
            --format sarif \
            --output ./results/trivy-scancode.sarif \
            ${{ env.DIR_DOCKERFILE }}
            
      - name: Listar arquivos de resultado
        run: |
          cd results
          pwd
          echo
          ls -lah
        if: always()
          
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./results/trivy-scancode.sarif
          category: trivy
        if: always()

  image-scanning:
    runs-on: ubuntu-latest
    needs: dependency-scanning
    if: always()
    
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Build de imagem
        run: |
          cd ${{ env.DIR_DOCKERFILE }}
          docker build . -t image-to-scan:test --no-cache

      - name: Instalar o Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Testar execução do Trivy
        run: trivy

      - name: Criar o diretório results
        run: mkdir -p results

      - name: Executar o Trivy gerando SARIF
        run: |
          trivy image --scanners vuln,secret,misconfig \
            --exit-code 1 \
            --format sarif \
            --output ./results/trivy-scanimage.sarif \
            image-to-scan:test
            
      - name: Listar arquivos de resultado
        run: |
          cd results
          pwd
          echo
          ls -lah
        if: always()
          
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./results/trivy-scanimage.sarif
          category: trivy
        if: always()
  
  tests:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    needs: image-scanning

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
